<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zonas de Entrega | v4</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>

<div class="app-layout">

  <div class="panel panel-import">
    <h2>📥 Importar PDF</h2>
    <div class="input-group">
      <label>Seleccionar archivo PDF</label>
      <input type="file" id="pdfInput" accept="application/pdf">
    </div>
    <button class="btn" id="analizarPdfBtn">🔎 Analizar PDF</button>
    <div class="input-group">
      <label>Estado</label>
      <div id="pdfEstado" class="resultado">Esperando archivo...</div>
    </div>
    <div class="input-group">
      <label>Resultados</label>
      <div id="pdfResultados" class="registro-datos" style="display:block; min-height:60px;"></div>
    </div>
  </div>
  
  <div class="panel panel-principal">
    <h1>📦 Despacho Express</h1>
    
    <div class="acciones-header">
      <input type="date" id="fechaActual">
    </div>

    <div class="input-group">
      <label>Cliente</label>
      <div class="search-box">
        <input type="text" id="inputCliente" placeholder="Nombre del cliente o empresa..." autocomplete="off">
        <ul id="sugerenciasCliente" class="sugerencias-list"></ul>
      </div>
    </div>

    <div class="input-group">
      <label>Zona / Ciudad</label>
      <div class="search-box">
        <input type="text" id="inputZona" placeholder="Escribí una ciudad..." autocomplete="off">
        <ul id="sugerenciasZona" class="sugerencias-list"></ul>
      </div>
    </div>

    <div class="resultado-container">
      <div class="resultado" id="resultado">Esperando datos...</div>
    </div>

    <div class="grid-contadores">
      <div class="card-contador">
        <span class="card-label">GBA 1</span>
        <input type="number" class="card-value" id="gba1" value="0" min="0">
      </div>
      <div class="card-contador">
        <span class="card-label">GBA 2</span>
        <input type="number" class="card-value" id="gba2" value="0" min="0">
      </div>
      <div class="card-contador">
        <span class="card-label">Lejanas</span>
        <input type="number" class="card-value" id="lejanas" value="0" min="0">
      </div>
      <div class="card-contador">
        <span class="card-label">CABA</span>
        <input type="number" class="card-value" id="caba" value="0" min="0">
      </div>
    </div>

    <button class="btn btn-guardar" id="guardarBtn">💾 Guardar Registro</button>
    <button class="btn btn-reset" id="resetBtn">🗑️ Limpiar panel</button>
  </div>

  <div class="panel panel-historial">
    <h2>📅 Historial de Despachos</h2>
    <div id="lista-historial"></div>
  </div>

</div>

<script>
  // Configure PDF.js worker — necessary for PDF parsing in browsers.
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
  }
</script>
<script type="module" src="app.js"></script>

</body>
</html>
